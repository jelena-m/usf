  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; }
    body {
      font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1, h2, h3, h4 { font-family: 'Bricolage Grotesque', sans-serif; }
    a { text-decoration: none; color: inherit; }
    ::selection { background: #3B5BFF; color: #fff; }

    :root {
      --blue: #3B5BFF;
      --blue-hover: #2a48e0;
      --blue-glow: rgba(59, 91, 255, 0.35);
      --bg: #080808;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.35);
      --text-faint: rgba(255,255,255,0.2);
    }

    /* PAGE LOADER */
    html.loading { overflow: hidden; cursor: none; }
    html.loading .custom-cursor { display: none; }
    .page-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0e0e0e; display: flex; align-items: center; justify-content: center; z-index: 99999; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transition: clip-path 0.8s cubic-bezier(0.7, 0, 0.3, 1); }
    .page-loader.skip { display: none; }
    .page-loader svg { width: 100px; height: auto; opacity: 1; }
    .page-loader .logo-bg { fill: rgba(255,255,255,0.05); }
    .page-loader .logo-fill { fill: #fff; }
    .page-loader.crack { clip-path: polygon(0 42%, 100% 58%, 100% 100%, 0 100%); pointer-events: none; box-shadow: 0 -30px 80px rgba(255,255,255,0.2), 0 -6px 30px rgba(255,255,255,0.12); }
    .page-loader.crack-full { clip-path: polygon(0 110%, 100% 110%, 100% 110%, 0 110%); }
    .page-loader.done { display: none; }
    .page-loader-left { position: fixed; top: 0; left: 0; width: 100%; height: 50%; background: #0e0e0e; z-index: 99998; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transition: clip-path 0.8s cubic-bezier(0.7, 0, 0.3, 1); }
    .page-loader-left.crack { clip-path: polygon(0 -10%, 100% -10%, 100% 42%, 0 58%); box-shadow: 0 30px 80px rgba(255,255,255,0.2), 0 6px 30px rgba(255,255,255,0.12); }
    .page-loader-left.done { display: none; }
    @keyframes logoFadeIn { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }

    /* NAV */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8,8,8,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-logo { display: flex; align-items: center; }
    .nav-logo svg { display: block; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .lang-switch { display: flex; align-items: center; gap: 0; background: rgba(255,255,255,0.08); border-radius: 6px; padding: 3px; border: 1px solid rgba(255,255,255,0.1); }
    .lang-switch button { background: none; border: none; color: rgba(255,255,255,0.4); padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 0.72rem; font-weight: 600; letter-spacing: 1px; transition: all 0.3s; display: flex; align-items: center; gap: 6px; border-radius: 4px; }
    .lang-switch button.active { background: rgba(255,255,255,0.15); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
    .lang-switch button:hover { color: #fff; }
    .lang-flag { width: 18px; height: 13px; border-radius: 2px; display: inline-block; overflow: hidden; flex-shrink: 0; }

    /* MAIN LAYOUT */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 72px;
    }
    .form-container {
      width: 100%;
      max-width: 400px;
    }
    .auth-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      margin-bottom: 64px;
    }
    .auth-logo svg { display: block; }
    .or-label {
      text-align: center;
      margin: 18px 0;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
    }

    /* SWITCH TABS */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }
    .tab-switch {
      display: flex;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .tab {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      background: none;
      border: none;
      padding: 10px 32px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.25s;
    }
    .tab:hover { color: rgba(255,255,255,0.7); }
    .tab.active {
      color: #fff;
      background: var(--blue);
    }

    /* SOCIAL BUTTONS */
    .social-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
      border: none;
    }
    .social-btn:hover { transform: translateY(-1px); }
    .social-btn svg { flex-shrink: 0; }
    .social-btn--google {
      background: #fff;
      color: #333;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* DIVIDER */

    /* FORM FIELDS */
    .form-group { margin-bottom: 20px; }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }
    .form-label {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .form-input, .form-select {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-input::placeholder { color: rgba(255,255,255,0.3); }
    .form-input:focus, .form-select:focus {
      background: rgba(255,255,255,0.12);
    }

    /* ===== SEARCHABLE DROPDOWN =====
       The same control the app uses (.usf-combo): a text field you can type
       into, a list that narrows as you type, and the native select kept
       underneath as the record of the value so every existing onchange
       handler keeps firing. */
    .usf-combo { position: relative; }
    /* Search left, filters right — that was an auto margin on the first
       select, and the select is hidden now, so it moves to the control that
       stands in for it. The original rule stays for the case where the
       script never runs. */
    .filters-bar .usf-combo-host:first-of-type { margin-left: auto; }
    .usf-combo input {
      width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.07);
      border: none; border-radius: 10px;
      color: #fff; font-size: 14px;
      font-family: 'Instrument Sans', sans-serif;
      padding: 12px 14px; padding-right: 32px;
      outline: none; cursor: pointer;
      transition: background 0.2s;
    }
    .usf-combo input:focus { background: rgba(255,255,255,0.12); }
    .usf-combo input::placeholder { color: rgba(255,255,255,0.4); }
    .usf-combo-caret {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      display: flex; align-items: center;
    }
    .usf-combo-list {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px);
      background: #1a1a1a; border-radius: 10px; padding: 6px; z-index: 200;
      max-height: 260px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .usf-combo.open .usf-combo-list { display: block; }
    .usf-combo.drop-up .usf-combo-list { top: auto; bottom: calc(100% + 6px); }
    .usf-combo-opt {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: rgba(255,255,255,0.6); font-family: inherit; font-size: 13px;
      padding: 9px 12px; border-radius: 7px; cursor: pointer;
    }
    .usf-combo-opt:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .usf-combo-empty { padding: 10px 12px; font-size: 12.5px; color: rgba(255,255,255,0.35); }

    .form-select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='rgba(255,255,255,0.3)' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
    }
    .form-select option {
      background: #1a1a1a;
      color: #fff;
    }

    /* SUBMIT BUTTON */
    /* ROUND 156: ista visina gumba kao u aplikaciji (42 px, na mobitelu 44) */
    .submit-btn, .social-btn, .verify-btn, .tab {
      box-sizing: border-box; min-height: 42px; padding-top: 0 !important; padding-bottom: 0 !important;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .submit-btn, .social-btn { display: flex; }
    @media (max-width: 768px) { .submit-btn, .social-btn, .verify-btn, .tab { min-height: 44px; } }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--blue-hover); transform: translateY(-1px); }

    /* MEMBERSHIP PAYMENT INFO */

    /* ===== ROUND 112 — oko za lozinku ===== */
    .pw-wrap { position: relative; display: block; }
    /* mjesta za oko, da se tekst lozinke ne podvuče pod njega */
    .pw-wrap .form-input { padding-right: 52px; }
    .pw-toggle {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; padding: 0; border-radius: 10px;
      /* ROUND 132: bilo je cursor: none, pa je mis nestajao nad okom */
      color: rgba(255,255,255,0.4); cursor: pointer;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: #fff; }
    .pw-toggle svg { width: 20px; height: 20px; display: block; }
    /* zatvoreno oko se vidi tek kad je lozinka otkrivena */
    .pw-toggle .pw-eye-off { display: none; }
    .pw-toggle.is-shown .pw-eye { display: none; }
    .pw-toggle.is-shown .pw-eye-off { display: block; }
    .pw-toggle.is-shown { color: #fff; }

    /* FORGOT PASSWORD LINK */
    .forgot-link {
      /* Centrirana i odmaknuta od gumba, a dodirna površina je 44 px visoka
         bez da je link razvučen preko cijele širine. */
      display: block;
      width: fit-content;
      margin: 12px auto 0;
      padding: 14px 10px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--blue); }
    /* ROUND 137: prototip to i kaze, ondje gdje se upisuje lozinka */
    .usf-proto-note {
      margin: 22px auto 0; max-width: 380px; text-align: center;
      font-size: 13px; line-height: 1.55; color: rgba(255,255,255,0.42);
    }

    /* CHECKBOXES */
    .checkbox-group { margin-bottom: 14px; }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      line-height: 1.4;
    }
    .checkbox-label input[type="checkbox"] {
      display: none;
    }
    .checkbox-custom {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-top: 2px;
    }
    .checkbox-custom svg { opacity: 0; transition: opacity 0.2s; }
    .checkbox-label input[type="checkbox"]:checked + .checkbox-custom {
      background: var(--blue);
      border-color: var(--blue);
    }
    .checkbox-label input[type="checkbox"]:checked + .checkbox-custom svg { opacity: 1; }
    .checkbox-text a {
      color: var(--blue);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .checkbox-text a:hover { text-decoration: none; }
    .optional-note {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      font-style: italic;
    }
    .consents-section { margin-top: 28px; margin-bottom: 24px; }

    /* ERROR */
    .error-msg {
      color: #FF6B6B;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 8px;
      padding: 12px 24px;
      color: #fff;
      font-size: 14px;
      font-family: 'Instrument Sans', sans-serif;
      z-index: 9999;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* VIEW TOGGLE */
    .view { display: none; }
    .view.active { display: block; }

    /* UPLOAD FIELD */
    .upload-field.has-file .upload-field-icon { color: #22C55E; }
    .upload-field.has-file .upload-field-text { color: #22C55E; }
    .upload-field-small.has-file { border-color: #22C55E; background: rgba(34,197,94,0.06); color: #22C55E; }
    .student-fields .form-label { color: #F59E0B; }
    .email-verify-section { display: none; margin-top: 8px; }
    .email-verify-section.visible { display: flex; gap: 8px; align-items: flex-end; }
    .email-verify-section .form-input { flex: 1; }
    .verify-btn { padding: 10px 18px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
    .verify-btn:hover { background: var(--blue-hover); }
    .verify-btn.verified { background: #22C55E; cursor: default; }
    /* The field stretches, the button keeps its own width. min-width:0 is
       what stops a flex child from refusing to shrink below its content. */
    .field-with-action { display: flex; gap: 8px; align-items: stretch; }
    .field-with-action .form-input { flex: 1; min-width: 0; }
    .verify-status { font-size: 12px; margin-top: 4px; display: block; }
    .verify-status.success { color: #22C55E; }
    .verify-status.pending { color: #F59E0B; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .nav { padding: 16px 20px; }
      .main-content { padding: 100px 20px 40px; }
      .form-row { flex-direction: column; gap: 0; }
      .tab { padding: 10px 24px; font-size: 13px; }

      /* iOS zooms into a field under 16px the moment it is focused */
      input:not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px !important; }
      /* a thumb needs about 44px: the two tabs, the forgot link, the links in
         the registration text, the caret of the occupation picker */
      .tab { min-height: 44px; }
      /* ROUND 112: pravilo iz runde 103 uzimalo je linku centriranje
         (inline-block) i privlačilo ga uz gumb (negativne margine). */
      .terms-text a, .register-terms a, label a, p a { display: inline-block; padding: 10px 0; margin: -10px 0; }
      .usf-combo-caret { padding: 13px 12px; right: 0; }
    }
  </style>
</head>

    /* ===== ROUND 137 — lozinka se sprema kao sazetak =====================
       SHA-256 napisan ovdje, a ne crypto.subtle, jer crypto.subtle ne radi
       kad je stranica otvorena izravno s diska (file://). */
    function usfSha256(str) {
      var bytes = new TextEncoder().encode(String(str));
      var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,

               0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
               0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
               0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
               0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
               0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
               0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      var l = bytes.length;
      var total = Math.ceil((l + 9) / 64) * 64;
      var m = new Uint8Array(total);
      m.set(bytes); m[l] = 0x80;
      var dv = new DataView(m.buffer);
      var bits = l * 8;
      dv.setUint32(total - 8, Math.floor(bits / 0x100000000));
      dv.setUint32(total - 4, bits >>> 0);
      var W = new Uint32Array(64);
      for (var off = 0; off < total; off += 64) {
        var t;
        for (t = 0; t < 16; t++) W[t] = dv.getUint32(off + t * 4);
        for (t = 16; t < 64; t++) {
          var x = W[t - 15], y = W[t - 2];
          var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
          var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
        }
        var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (t = 0; t < 64; t++) {
          var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
          var ch = (e & f) ^ (~e & g);
          var t1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
          var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
          var mj = (a & b) ^ (a & c) ^ (b & c);
          var t2 = (S0 + mj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
      }
      return H.map(function (v) { return ('00000000' + v.toString(16)).slice(-8); }).join('');
    }
    /* Email ulazi u sazetak, pa dvije iste lozinke ne daju isti zapis. */
    function usfPwHash(email, pw) {
      return 's1:' + usfSha256('usf|' + String(email || '').trim().toLowerCase() + '|' + String(pw || ''));
    }
    function usfPwMatches(user, email, pw) {
      if (!user) return false;
      if (user.passwordHash) return user.passwordHash === usfPwHash(email, pw);

    function usfScrubPasswords() {

        if (!u.passwordHash) u.passwordHash = usfPwHash(u.email, u.password);

        return true;
      };
      try {
        var users = JSON.parse(localStorage.getItem('usf_users') || '[]');
        var changed = false;
        users.forEach(function (u) { if (fix(u)) changed = true; });
        if (changed) localStorage.setItem('usf_users', JSON.stringify(users));
      } catch (e) {}
      try {
        var cu = JSON.parse(localStorage.getItem('usf_current_user') || 'null');
        if (fix(cu)) localStorage.setItem('usf_current_user', JSON.stringify(cu));
      } catch (e) {}
    }

    // ===== LOGIN =====
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      const isEn = document.documentElement.lang === 'en';

      const users = JSON.parse(localStorage.getItem('usf_users') || '[]');
      /* ROUND 137: usporeduju se sazeci; stari citljivi zapis jos se
         prihvaca jednom, pa se odmah pretvori. */
      const user = users.find(u => u.email === email && usfPwMatches(u, email, password));
      if (user && typeof user.password === 'string') {
        user.passwordHash = usfPwHash(email, password);
        delete user.password;
      }

      if (!user) {
        errorEl.textContent = isEn ? 'Invalid email or password.' : 'Neispravna email adresa ili lozinka.';
        errorEl.classList.add('visible');
        return;
      }

      // Update last login
      user.lastLogin = new Date().toISOString();
      const idx = users.findIndex(u => u.id === user.id);
      users[idx] = user;
      localStorage.setItem('usf_users', JSON.stringify(users));
      localStorage.setItem('usf_current_user', JSON.stringify(user));
      /* Nova prijava ne nastavlja ondje gdje je netko stao: zapamćeni panel
         se briše, pa aplikacija otvara svoj početni zaslon. */
      try { Object.keys(localStorage).forEach(function(k) { if (k.indexOf('usf_active_panel') === 0) localStorage.removeItem(k); }); } catch (e) {}   /* ROUND 161: kljuc je po racunu od runde 159 */

    // ===== REGISTER =====

    // ===== LANGUAGE SUPPORT =====
    function applyLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-hr][data-en]').forEach(el => {
        const text = el.getAttribute('data-' + lang);
        if (text) {
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.placeholder = text;
          } else {
            el.innerHTML = text;
          }
        }
      });
    }

    /* Oko pokraj lozinke: polje se prebacuje između password i text. */
    function usfTogglePassword(btn) {
      var input = btn.parentElement && btn.parentElement.querySelector('input');
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('is-shown', show);
      var en = document.documentElement.lang === 'en';
      btn.setAttribute('aria-label', show ? (en ? 'Hide password' : 'Sakrij lozinku')
                                          : (en ? 'Show password' : 'Prikaži lozinku'));
      /* fokus se vraća u polje, na isto mjesto u tekstu */
      try { var p = input.selectionStart; input.focus(); if (p !== null) input.setSelectionRange(p, p); } catch (e) {}
    }

    function switchLang(lang) {
      applyLanguage(lang);
      localStorage.setItem('usf_lang', lang);
      // No switch on this page — the language comes from wherever it was set on
    // the site. This loop matches nothing here and is left for the shared code.
    document.querySelectorAll('.lang-switch button').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
    }

    // Check stored language preference
    const storedLang = localStorage.getItem('usf_lang');
    if (storedLang) {
      switchLang(storedLang);

    // Check if URL has ?mode=register to show register tab directly
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'register') {
      switchTab('register');

    // Page loader crack animation
    setTimeout(function() {
      var loader = document.getElementById('pageLoader');
      var loaderLeft = document.getElementById('pageLoaderLeft');
      if (loader && !loader.classList.contains('skip')) {
        loader.classList.add('crack');
        if (loaderLeft) loaderLeft.classList.add('crack');
        document.documentElement.classList.remove('loading');
        setTimeout(function(){
          loader.classList.add('crack-full');
          setTimeout(function(){
            loader.classList.add('done');
            if (loaderLeft) loaderLeft.classList.add('done');
          }, 400);
        }, 500);
      }
    }, 800);

  <script>
  /* ===== SEARCHABLE DROPDOWN =====
     Ported from dashboard.html so the two behave the same. Every native
     <select> on the page is replaced by a text field with a narrowing list;
     the select itself stays in the DOM, hidden, holding the value — so the
     onchange handlers already written against it keep working untouched.
     A select that must stay native carries data-usf-noenh. */
  (function() {
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function lang() { return document.documentElement.lang === 'en' ? 'en' : 'hr'; }
    function wrapOf(el) { return el && el.closest ? el.closest('.usf-combo') : null; }

    window.usfPickPaint = function(wrap, filter) {
      var list = wrap.querySelector('.usf-combo-list');
      var opts = [];
      try { opts = JSON.parse(list.getAttribute('data-options') || '[]'); } catch (e) {}
      var q = (filter || '').trim().toLowerCase();
      var hits = q ? opts.filter(function(o) {
        return String(o.label).toLowerCase().indexOf(q) !== -1;
      }) : opts;
      list.innerHTML = hits.length
        ? hits.map(function(o) {
            return '<button type="button" class="usf-combo-opt" onclick="usfPickChoose(this, ' +
              JSON.stringify(String(o.v)).replace(/"/g, '&quot;') + ', ' +
              JSON.stringify(String(o.label)).replace(/"/g, '&quot;') + ')">' +
              esc(o.label) + '</button>';
          }).join('')
        : '<div class="usf-combo-empty">' + (lang() === 'hr' ? 'Nema rezultata' : 'No matches') + '</div>';
    };

    /* A list you have to scroll the page to read opened the wrong way. */
    function place(wrap) {
      var list = wrap.querySelector('.usf-combo-list');
      var input = wrap.querySelector('input');
      if (!list || !input) return;
      var r = input.getBoundingClientRect();
      var below = window.innerHeight - r.bottom;
      var need = Math.min(list.scrollHeight + 12, 268);
      wrap.classList.toggle('drop-up', below < need && r.top > below);
    }

    window.usfPickOpen = function(input) {
      var wrap = wrapOf(input);
      if (!wrap) return;
      document.querySelectorAll('.usf-combo.open').forEach(function(w) {
        if (w !== wrap) w.classList.remove('open');
      });
      /* Opening shows everything: you came to see the options, not to be
         filtered by whatever is already in the box. */
      input.select();
      usfPickPaint(wrap, '');
      wrap.classList.add('open');
      place(wrap);
    };
    window.usfPickToggle = function(btn) {
      var wrap = wrapOf(btn);
      if (!wrap) return;
      if (wrap.classList.contains('open')) { wrap.classList.remove('open'); return; }
      var input = wrap.querySelector('input');
      usfPickOpen(input);
      input.focus();
    };
    window.usfPickFilter = function(input) {
      var wrap = wrapOf(input);
      if (!wrap) return;
      usfPickPaint(wrap, input.value);
      wrap.classList.add('open');
      place(wrap);
    };
    window.usfPickChoose = function(btn, value, label) {
      var wrap = wrapOf(btn);
      if (!wrap) return;
      wrap.setAttribute('data-value', value);
      wrap.querySelector('input').value = label;
      wrap.classList.remove('open');
      var sel = wrap._usfSelect;
      if (sel) {
        sel.value = value;
        sel.dispatchEvent(new Event('input', { bubbles: true }));
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
    };
    window.usfComboKey = function(e, input) {
      var wrap = wrapOf(input);
      if (!wrap) return;
      if (e.key === 'Escape' || e.key === 'Enter') {
        wrap.classList.remove('open');
        if (e.key === 'Enter') e.preventDefault();
      }
    };
    document.addEventListener('click', function(e) {
      if (!e.target.closest || !e.target.closest('.usf-combo')) {
        document.querySelectorAll('.usf-combo.open').forEach(function(w) { w.classList.remove('open'); });
      }
    });

    /* A disabled option ("Odaberi zanimanje") is a prompt, not something you
       can pick — it stays out of the list and becomes the placeholder. */
    function optionsOf(sel) {
      return [].filter.call(sel.options, function(o) { return !o.disabled; })
        .map(function(o) { return { v: o.value, label: o.textContent }; });
    }
    function hintOf(sel) {
      var prompt = [].filter.call(sel.options, function(o) { return o.disabled; })[0];
      if (prompt) return prompt.textContent;
      return lang() === 'hr' ? 'Traži...' : 'Search...';
    }
    function labelOf(sel) {
      var o = sel.options[sel.selectedIndex];
      return (o && !o.disabled) ? o.textContent : '';
    }

    var n = 0;
    function enhance(sel) {
      if (sel.getAttribute('data-usf-enh')) return;
      if (sel.multiple || sel.disabled || sel.getAttribute('data-usf-noenh')) return;
      sel.setAttribute('data-usf-enh', '1');
      /* A required control the browser cannot focus blocks submit with only a
         console message to show for it. The form's own handler checks this
         field, so the attribute goes. */
      if (sel.required) { sel.required = false; sel.setAttribute('data-was-required', '1'); }
      var id = 'usfsel-' + (++n);
      var opts = optionsOf(sel);
      var host = document.createElement('div');
      host.className = 'usf-combo-host';
      host.style.cssText = sel.style.cssText || '';
      if (!host.style.width) host.style.minWidth = Math.max(sel.offsetWidth || 0, 160) + 'px';
      host.innerHTML =
        '<div class="usf-combo" data-combo="' + id + '" data-value="' + esc(sel.value) + '">' +
          '<input value="' + esc(labelOf(sel)) + '" autocomplete="off" ' +
            'placeholder="' + esc(hintOf(sel)) + '" ' +
            'onfocus="usfPickOpen(this)" oninput="usfPickFilter(this)" onkeydown="usfComboKey(event, this)">' +
          '<button type="button" class="usf-combo-caret" onclick="usfPickToggle(this)" tabindex="-1">' +
            '<svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
          '<div class="usf-combo-list"></div>' +
        '</div>';
      sel.parentNode.insertBefore(host, sel);
      sel.style.display = 'none';
      var wrap = host.querySelector('.usf-combo');
      wrap.querySelector('.usf-combo-list').setAttribute('data-options', JSON.stringify(opts));
      wrap._usfSelect = sel;
      sel._usfWrap = wrap;
    }

    /* The option lists here are not fixed: one page rebuilds them from the
       data, and switching language rewrites every label. So the upgrade also
       re-reads them, rather than snapshotting once and going stale. */
    function refresh(sel) {
      var wrap = sel._usfWrap;
      if (!wrap) return;
      var list = wrap.querySelector('.usf-combo-list');
      var sig = JSON.stringify(optionsOf(sel));
      var same = list.getAttribute('data-options') === sig &&
                 wrap.getAttribute('data-value') === String(sel.value);
      if (same) return;
      list.setAttribute('data-options', sig);
      wrap.setAttribute('data-value', sel.value);
      var input = wrap.querySelector('input');
      input.placeholder = hintOf(sel);
      if (document.activeElement !== input) input.value = labelOf(sel);
      if (wrap.classList.contains('open')) usfPickPaint(wrap, '');
    }

    var pending = null;
    function sweep() {
      pending = null;
      document.querySelectorAll('select').forEach(function(sel) {
        if (sel.getAttribute('data-usf-enh')) refresh(sel); else enhance(sel);
      });
    }
    function schedule() { if (pending) return; pending = setTimeout(sweep, 60); }
    if (typeof MutationObserver !== 'undefined') {
      new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
    }
    document.addEventListener('DOMContentLoaded', schedule);
    schedule();
  })();
  </script>

  <script>

    var html = document.documentElement;
    var unlock = function () { html.classList.remove('loading'); };
    /* Kartica koja se tek sad vidi: animacija je možda stajala. */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) setTimeout(unlock, 900);

    window.addEventListener('pageshow', function () { setTimeout(unlock, 1200); });

    setTimeout(unlock, 3000);
    /* Klik na stavku izbornika zatvara izbornik — i skida bravu s njim. */
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('.nav-links a')) html.classList.remove('usf-nav-open');
    }, true);
